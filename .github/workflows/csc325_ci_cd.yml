name: CSC325 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Test
        run: python manage.py test --verbosity 2

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Tests passed. Deployment demonstration complete for commit $GITHUB_SHA."
